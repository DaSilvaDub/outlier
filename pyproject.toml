[project]
name = "outlier-multisport-scraper"
version = "0.1.0"
description = "Standalone Outlier multi-sport discovery and props scraper."
requires-python = ">=3.11"
dependencies = [
    "openai>=2.43,<3",
    "anthropic>=0.112.0,<1",
    "google-genai>=2.10.0,<3",
]

[tool.setuptools]
packages = ["outlier_scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disable_error_code = ["union-attr"]


[tool.pyright]
include = ["outlier_scrapers"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
reportMissingImports = "none"


