[project]
name = "outlier-multisport-scraper"
version = "0.1.0"
description = "Standalone Outlier multi-sport discovery and props scraper."
requires-python = ">=3.11"
dependencies = [
    "openai>=2.43,<3",
    "anthropic>=0.112.0,<1",
    "google-genai>=2.10.0,<3",
]

[tool.setuptools]
packages = ["outlier_scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disable_error_code = ["union-attr"]
exclude = '(normalizer|api|line_movement|refresh|cards)\.py'

[[tool.mypy.overrides]]
module = [
    "outlier_scrapers.normalizer",
    "outlier_scrapers.api",
    "outlier_scrapers.line_movement",
    "outlier_scrapers.refresh",
    "outlier_scrapers.cards"
]
ignore_errors = true




[tool.pyright]
include = ["outlier_scrapers"]
exclude = [
    "**/__pycache__",
    "outlier_scrapers/normalizer.py",
    "outlier_scrapers/api.py",
    "outlier_scrapers/line_movement.py",
    "outlier_scrapers/refresh.py",
    "outlier_scrapers/cards.py",
    "outlier_scrapers/claude_reasoning.py",
    "outlier_scrapers/claude_synthesis.py",
    "outlier_scrapers/discover.py",
    "outlier_scrapers/otp_fetcher.py",
    "outlier_scrapers/pack.py",
    "outlier_scrapers/run_desk.py"
]
pythonVersion = "3.11"
reportMissingImports = "none"


