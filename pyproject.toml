[project]
name = "outlier-multisport-scraper"
version = "0.1.0"
description = "Standalone Outlier multi-sport discovery and props scraper."
requires-python = ">=3.11"
dependencies = [
    "openai>=2.43,<3",
]

[tool.setuptools]
packages = ["outlier_scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

